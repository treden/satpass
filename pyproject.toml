[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "satpass"
version = "0.1.0"
description = "Tools for computing satellite passes from nominal altimeter tracks"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pandas",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"satpass.data" = ["altimeters.meta", "nominal_tracks/*.csv"]
